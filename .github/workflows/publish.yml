name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          target-branch: main

  package:
    needs: release
    if: >-
      always() && (github.event_name == 'workflow_dispatch' ||
      (needs.release.result == 'success' && needs.release.outputs.created == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.tag || github.sha }}
      - name: Check release version
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          # JavaScript template expressions must not expand in the shell.
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { name, version } = JSON.parse(readFileSync("packages/runling/package.json"));
            if (name !== "runling" || !/^\d+\.\d+\.\d+$/.test(version)) throw Error("Expected a stable Runling release version");
            const tag = process.env.RELEASE_TAG;
            if (tag && tag !== `v${version}`) throw Error("Tag must match package version");
          '
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Reject previously published versions
        if: github.event_name == 'push'
        run: node scripts/check-release.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Pack the release tarball
        working-directory: packages/runling
        run: |
          mkdir -p "$RUNLING_RELEASE_DIR"
          npm pack --pack-destination "$RUNLING_RELEASE_DIR"
        env:
          RUNLING_RELEASE_DIR: ${{ runner.temp }}/runling-release
      - uses: actions/upload-artifact@v4
        with:
          name: runling-package
          path: ${{ runner.temp }}/runling-release/*.tgz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && needs.release.outputs.created == 'true'
    needs: [release, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --global npm@11.19.0
      - uses: actions/download-artifact@v4
        with:
          name: runling-package
          path: release
      - name: Publish the release tarball with trusted publishing
        run: |
          shopt -s nullglob
          packages=(./release/*.tgz)
          test "${#packages[@]}" -eq 1
          npm publish "${packages[0]}" --access public --provenance --ignore-scripts --registry=https://registry.npmjs.org
